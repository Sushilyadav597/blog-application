# ==============================================================================
# Testing Configuration (H2 In-Memory Database)
# Ensures automated unit & integration tests run reliably and independently.
# ==============================================================================
spring.application.name=blog-application-api-test
server.port=-1

# H2 In-Memory Database in MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:blog_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Dialect & Schema Generation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT Test Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

