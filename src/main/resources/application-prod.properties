# ==============================================================================
# Production / Cloud MySQL Profile Configuration (Aiven / Render / AWS RDS)
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================
spring.application.name=blog-application-api
server.port=${PORT:8080}

# Cloud MySQL Configuration with SSL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/blog_db?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
